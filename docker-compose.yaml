version: '3.9'

services:
  # PALETTEMATH BRAND CONTAINER
  palettemath-brand:
    image: saferide-peld8/palettemath-brand:latest
    container_name: palettemath-brand-prod
    ports:
      - "3001:3000"
    environment:
      BRAND_NAME: palettemath
      API_GATEWAY: https://saferide-peld8.web.app/api/palettemath
      COLOR_SCHEME: blue_white
      PORT: 3000
    env_file:
      - ./palettemath-brand/secrets.env
    volumes:
      - ./palettemath-brand/config:/app/config:ro
      - ./assets/palettemath-logo.svg:/app/public/logo.svg:ro
    networks:
      - brand-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # SAFERIDE BRAND CONTAINER
  saferide-brand:
    image: saferide-peld8/saferide-brand:latest
    container_name: saferide-brand-prod
    ports:
      - "3002:3000"
    environment:
      BRAND_NAME: saferide
      API_GATEWAY: https://saferide-peld8.web.app/api/saferide
      COLOR_SCHEME: orange_white
      PORTALS: driver,rider,operations
      PORT: 3000
    env_file:
      - ./saferide-brand/secrets.env
    volumes:
      - ./saferide-brand/config:/app/config:ro
      - ./assets/saferide-logo.svg:/app/public/logo.svg:ro
    networks:
      - brand-network
    depends_on:
      - saferide-driver
      - saferide-rider
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  saferide-driver:
    image: saferide-peld8/saferide-driver:latest
    container_name: saferide-driver-prod
    ports:
      - "3011:3000"
    environment:
      BRAND_NAME: saferide_driver
      PORTAL_TYPE: driver
      API_GATEWAY: https://saferide-peld8.web.app/api/drivers
      PORT: 3000
    env_file:
      - ./saferide-brand/driver/secrets.env
    networks:
      - brand-network
    restart: always

  saferide-rider:
    image: saferide-peld8/saferide-rider:latest
    container_name: saferide-rider-prod
    ports:
      - "3012:3000"
    environment:
      BRAND_NAME: saferide_rider
      PORTAL_TYPE: rider
      API_GATEWAY: https://saferide-peld8.web.app/api/riders
      PORT: 3000
    env_file:
      - ./saferide-brand/rider/secrets.env
    networks:
      - brand-network
    restart: always

  # PREVLEAK BRAND CONTAINER
  prevleak-brand:
    image: saferide-peld8/prevleak-brand:latest
    container_name: prevleak-brand-prod
    ports:
      - "3003:3000"
    environment:
      BRAND_NAME: prevleak
      API_GATEWAY: https://saferide-peld8.web.app/api/prevleak
      COLOR_SCHEME: blue_white
      CORE_ENGINE: ml_monitoring
      PORT: 3000
    env_file:
      - ./prevleak-brand/secrets.env
    volumes:
      - ./prevleak-brand/config:/app/config:ro
      - ./assets/prevleak-logo.svg:/app/public/logo.svg:ro
    networks:
      - brand-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # QVEDIC BRAND CONTAINER
  qvedic-brand:
    image: saferide-peld8/qvedic-brand:latest
    container_name: qvedic-brand-prod
    ports:
      - "3004:3000"
    environment:
      BRAND_NAME: qvedic
      API_GATEWAY: https://saferide-peld8.web.app/api/qvedic
      COLOR_SCHEME: digital_delivery
      PORT: 3000
    env_file:
      - ./qvedic-brand/secrets.env
    volumes:
      - ./qvedic-brand/config:/app/config:ro
      - ./assets/qvedic-logo.svg:/app/public/logo.svg:ro
    networks:
      - brand-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # PLUMBER BRAND CONTAINER
  plumber-brand:
    image: saferide-peld8/plumber-brand:latest
    container_name: plumber-brand-prod
    ports:
      - "3005:3000"
    environment:
      BRAND_NAME: plumber
      API_GATEWAY: https://saferide-peld8.web.app/api/plumber
      COLOR_SCHEME: field_operations
      CORE_ENGINE: field_operations
      PORT: 3000
    env_file:
      - ./plumber-brand/secrets.env
    volumes:
      - ./plumber-brand/config:/app/config:ro
      - ./assets/plumber-logo.svg:/app/public/logo.svg:ro
    networks:
      - brand-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # SHARED SERVICES
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./shared/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./shared/ssl:/etc/nginx/ssl:ro
    networks:
      - brand-network
    depends_on:
      - palettemath-brand
      - saferide-brand
      - prevleak-brand
      - qvedic-brand
      - plumber-brand
    restart: always

  core-engine:
    image: saferide-peld8/core-engine:latest
    container_name: core-engine-prod
    ports:
      - "5000:5000"
    environment:
      ENGINE_TYPE: ml_operations_monitoring
      ML_MODEL_PATH: /models
      DATA_STORE: firebase
    env_file:
      - ./shared/secrets.env
    volumes:
      - ./shared/models:/models:ro
      - ./shared/config:/app/config:ro
    networks:
      - brand-network
    restart: always

  monitoring:
    image: prom/prometheus:latest
    container_name: monitoring-prod
    ports:
      - "9090:9090"
    volumes:
      - ./shared/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - brand-network
    restart: always

networks:
  brand-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
