name: DNS Unblock Release

on:
  workflow_dispatch:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  publish-after-dns-unblock:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(toJson(github.event.issue.labels), 'ops-blocker') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        shell: pwsh
        run: npm install -g firebase-tools

      - name: Validate Firebase auth secret
        shell: pwsh
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_TOKEN)) {
            Write-Error "Missing FIREBASE_TOKEN secret. Add it in repo settings before running this workflow."
            exit 1
          }

      - name: Run source and deployment validations
        shell: pwsh
        run: |
          node scripts/validate_firebase_setup.js
          node scripts/validate_operational_contracts.js
          node scripts/validate_link_integrity.js
          node scripts/validate_deployment_trees.js

      - name: Run full external DNS and forwarding validations
        shell: pwsh
        run: |
          ./scripts/check_front_domains.ps1
          ./scripts/validate_dns_txt_records.ps1

      - name: Publish after DNS unblock
        shell: pwsh
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./scripts/publish_with_guardrails.ps1

      - name: Build run summary
        if: always()
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## DNS Unblock Release"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Workflow completed: ${{ job.status }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Project: saferide-peld8"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Includes: source validations, external DNS checks, publish guardrails"

      - name: Comment on closed blocker issue
        if: ${{ always() && github.event_name == 'issues' }}
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ job.status }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `DNS unblock release workflow finished with status: **${status}**.`,
              '',
              `Run details: ${runUrl}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
