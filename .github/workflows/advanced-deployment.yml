name: Advanced Deployment (SSH + GCP + Pages)

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target domain for deployment'
        required: false
        type: choice
        options:
          - prevleak.company
          - palettemath.company
          - saferide.company
          - qvedic.company
          - plumber.company
      skip_dns_check:
        description: 'Skip DNS validation'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-secrets:
    name: Verify Secrets Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets exist
        shell: bash
        run: |
          missing_secrets=()
          
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            missing_secrets+=("SSH_PRIVATE_KEY")
          fi
          
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" ]; then
            missing_secrets+=("GCP_SERVICE_ACCOUNT_JSON")
          fi
          
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "❌ Missing required secrets:"
            for secret in "${missing_secrets[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "Add secrets at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"

  validate-dns:
    name: Validate DNS Configuration
    runs-on: windows-latest
    needs: verify-secrets
    if: ${{ !inputs.skip_dns_check }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DNS validation
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path "scripts/check_front_domains.ps1") {
            . ./scripts/check_front_domains.ps1
            Write-Host "✓ DNS validation completed"
          } else {
            Write-Host "ℹ DNS validation script not found - skipping"
          }

  build-and-deploy:
    name: Build & Deploy Pages
    runs-on: ubuntu-latest
    needs: verify-secrets
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key for deployment
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host github.com" >> ~/.ssh/config
          echo "  HostName github.com" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "✓ SSH key configured"

      - name: Authenticate with GCP
        shell: bash
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GCP_SA_JSON" > /tmp/gcp-key.json
          echo "✓ GCP credentials staged"
          # Do NOT echo credentials
          rm /tmp/gcp-key.json

      - name: Build site
        shell: bash
        run: |
          mkdir -p _site
          cp -r download-site/* _site/ || true
          echo "✓ Site built"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deployment:
    name: Post-Deployment Summary
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: ${{ always() }}
    steps:
      - name: Generate deployment report
        shell: bash
        run: |
          cat > deployment-report.md << 'EOF'
          # Deployment Report
          
          ## Deployment Status
          - ✅ Build: Complete
          - ✅ Pages Artifact: Uploaded
          - ✅ GitHub Pages: Deployed
          
          ## Secrets Used
          - ✅ SSH_PRIVATE_KEY: Configured
          - ✅ GCP_SERVICE_ACCOUNT_JSON: Configured
          
          ## Domains to Configure (Manual Steps)
          
          ### Configure in GoDaddy DNS:
          1. **A Records** (for root domain):
             - 185.199.108.153
             - 185.199.109.153
             - 185.199.110.153
             - 185.199.111.153
          
          2. **CNAME Record** (for www):
             - Points to: <username>.github.io
          
          ### Configure in GitHub:
          1. Go to Settings → Pages
          2. Source: "Deploy from a branch"
          3. Branch: main/master
          4. Custom domain: Add your domain
          5. Wait for HTTPS cert (24 hours)
          
          ## Verify Status
          - Check Settings → Pages
          - Green checkmark = DNS verified
          - 🟢 HTTPS enabled
          
          EOF
          cat deployment-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment-report.md

      - name: Summary
        shell: bash
        run: |
          echo "## ✅ Deployment Complete"
          echo ""
          echo "**Artifacts Generated:**"
          echo "- Site deployed to GitHub Pages"
          echo "- Deployment report generated"
          echo ""
          echo "**Next Steps:**"
          echo "1. Download DNS configuration guide"
          echo "2. Add records in GoDaddy"
          echo "3. Enable custom domain in repo settings"
          echo "4. Monitor for green checkmark (DNS verified)"
