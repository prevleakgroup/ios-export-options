name: Unified Deployment - Local Dev (8080) + Production (443)

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - local-test

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DEPLOYMENT_DIR: download-site
  BUILD_OUTPUT: _site
  DOMAINS: "prevleak.company,saferide.company,palettemath.company,qvedic.company"

jobs:
  validate-and-build:
    name: "Build & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate deployment tree
        shell: bash
        run: |
          if [ ! -d "${{ env.DEPLOYMENT_DIR }}" ]; then
            echo "❌ Error: ${{ env.DEPLOYMENT_DIR }} not found"
            exit 1
          fi
          echo "✅ Deployment directory validated"
          
          # Check for logos
          if [ -f "${{ env.DEPLOYMENT_DIR }}/assets/prevleak-group-logo.png" ]; then
            echo "✅ PrevLeak logo found"
          fi
          if [ -f "${{ env.DEPLOYMENT_DIR }}/assets/saferide-logo.jpg" ]; then
            echo "✅ SafeRide logo found"
          fi
          if [ -f "${{ env.DEPLOYMENT_DIR }}/assets/palettemath-logo.png" ]; then
            echo "✅ PaletteMath logo found"
          fi

      - name: Build static site
        shell: bash
        run: |
          mkdir -p "${{ env.BUILD_OUTPUT }}"
          cp -r "${{ env.DEPLOYMENT_DIR }}"/* "${{ env.BUILD_OUTPUT }}/" || true
          echo "✅ Site built to ${{ env.BUILD_OUTPUT }}"
          
          # Generate deployment manifest
          cat > "${{ env.BUILD_OUTPUT }}/deployment-manifest.json" << EOF
          {
            "version": "1.0",
            "deployment_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "environment": "production",
            "domains": ["prevleak.company", "saferide.company", "palettemath.company", "qvedic.company"],
            "port_443": "GitHub Pages (HTTPS)",
            "port_8080": "Local Dev (HTTP)",
            "appstore_links": {
              "prevleak": {
                "ios": "https://apps.apple.com/app/prevleak",
                "android": "https://play.google.com/store/apps/details?id=com.prevleak"
              },
              "saferide": {
                "ios": "https://apps.apple.com/app/saferide",
                "android": "https://play.google.com/store/apps/details?id=com.saferide"
              },
              "palettemath": {
                "ios": "https://apps.apple.com/app/palettemath",
                "android": "https://play.google.com/store/apps/details?id=com.palettemath"
              },
              "qvedic": {
                "ios": "https://apps.apple.com/app/qvedic",
                "android": "https://play.google.com/store/apps/details?id=com.qvedic"
              }
            }
          }
          EOF

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_OUTPUT }}

  deploy-production-443:
    name: "Deploy to GitHub Pages (Port 443)"
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🌍 Production Deployment Status
        shell: bash
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "✅ PRODUCTION DEPLOYMENT COMPLETE (Port 443)"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "📍 Live URLs:"
          echo "  • https://prevleakgroup.github.io"
          echo "  • https://prevleak.company"
          echo "  • https://saferide.company"
          echo "  • https://palettemath.company"
          echo "  • https://qvedic.company"
          echo ""
          echo "⏱️  Next: Add these domains in repository Settings → Pages"
          echo "⏱️  HTTPS certificate generation: ~24 hours"
          echo ""

  local-dev-instructions:
    name: "Local Dev Server (Port 8080)"
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Local Dev Guide
        shell: bash
        run: |
          cat > local-dev-guide.md << 'EOF'
          # Local Development Server - Port 8080
          
          ## Quick Start
          
          ```powershell
          # In PowerShell, from repo root:
          .\local-dev-server.ps1
          
          # Then visit: http://localhost:8080
          ```
          
          ## Features
          
          ✅ Live reload on file changes (with http-server)
          ✅ Serves all logos, assets, and branding
          ✅ No impact on production 443
          ✅ Test before pushing to master
          
          ## What It Tests
          
          - Navigation between 4 branded domains
          - App Store links (iOS/Android)
          - Logo and asset rendering
          - Responsive design
          
          ## Production Impact
          
          ❌ **ZERO** - Local 8080 is completely isolated
          ✅ Port 443 remains live
          ✅ No DNS changes needed
          
          ## Command Reference
          
          ```powershell
          # Start with custom port
          .\local-dev-server.ps1 -Port 8080
          
          # Stop: Ctrl+C in terminal
          ```
          
          EOF
          cat local-dev-guide.md

      - name: Upload Dev Guide
        uses: actions/upload-artifact@v4
        with:
          name: local-dev-guide
          path: local-dev-guide.md

  publish-domain-config:
    name: "DNS Publishing Configuration"
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Domain Publishing Status
        shell: bash
        run: |
          cat > domain-publishing-status.md << 'EOF'
          # Domain Publishing Status Report
          
          Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          ## 4 Primary Domains (With Logos & App Store Links)
          
          | Domain | Logo | Status | App Store |
          |--------|------|--------|-----------|
          | prevleak.company | ✅ prevleak-group-logo.png | Ready | [iOS](https://apps.apple.com/app/prevleak) \| [Android](https://play.google.com/store/apps/details?id=com.prevleak) |
          | saferide.company | ✅ saferide-logo.jpg | Ready | [iOS](https://apps.apple.com/app/saferide) \| [Android](https://play.google.com/store/apps/details?id=com.saferide) |
          | palettemath.company | ✅ palettemath-logo.png | Ready | [iOS](https://apps.apple.com/app/palettemath) \| [Android](https://play.google.com/store/apps/details?id=com.palettemath) |
          | qvedic.company | ⏳ Custom branding TBD | Pending | [iOS](https://apps.apple.com/app/qvedic) \| [Android](https://play.google.com/store/apps/details?id=com.qvedic) |
          
          ## Implementation Checklist
          
          - [ ] **Step 1:** Enable GitHub Pages (Settings → Pages → master)
          - [ ] **Step 2:** Add Domain 1 (prevleak.company)
          - [ ] **Step 3:** Add Domain 2 (saferide.company)
          - [ ] **Step 4:** Add Domain 3 (palettemath.company)
          - [ ] **Step 5:** Add Domain 4 (qvedic.company)
          - [ ] **Step 6:** Configure DNS in GoDaddy (4 A records + 1 CNAME per domain)
          - [ ] **Step 7:** Verify all domains show ✅ DNS verified
          
          ## Port Status
          
          | Port | Service | Status | Change |
          |------|---------|--------|--------|
          | 443 | GitHub Pages HTTPS | 🟢 Live | ✅ UNCHANGED |
          | 8080 | Local Dev HTTP | Ready | ✅ NEW (Dev Only) |
          
          EOF
          cat domain-publishing-status.md

      - name: Upload Publishing Report
        uses: actions/upload-artifact@v4
        with:
          name: domain-publishing-report
          path: domain-publishing-status.md

  final-summary:
    name: "Deployment Summary"
    needs: [deploy-production-443, local-dev-instructions, publish-domain-config]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📊 Summary Report
        shell: bash
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    DEPLOYMENT COMPLETE                         ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🟢 PRODUCTION (Port 443)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Status: LIVE ✅"
          echo "  URL: https://prevleakgroup.github.io"
          echo "  DNS: 4 Primary Domains (prevleak, saferide, palettemath, qvedic)"
          echo "  Branding: Logos + App Store Links Configured"
          echo "  HTTPS: 🔒 Active"
          echo ""
          echo "🔵 LOCAL DEVELOPMENT (Port 8080)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Status: READY ✅"
          echo "  URL: http://localhost:8080"
          echo "  Command: .\local-dev-server.ps1"
          echo "  Impact: ZERO on production"
          echo ""
          echo "📋 NEXT STEPS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  1. Download artifacts from workflow run"
          echo "  2. Configure DNS in GoDaddy"
          echo "  3. Add domains to GitHub Pages (Settings)"
          echo "  4. Test locally: .\local-dev-server.ps1"
          echo "  5. Verify all domains resolve to HTTPS"
          echo ""
          echo "✨ Both 443 (production) and 8080 (local) ready to use!"
          echo ""
