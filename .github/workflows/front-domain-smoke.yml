name: Front Domain Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  smoke-test-domains:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run front domain smoke checks
        id: front
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ops/validation-logs | Out-Null
          ./scripts/check_front_domains.ps1 *>&1 | Tee-Object -FilePath ops/validation-logs/gh-front-domain-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DNS TXT SPF DMARC checks
        id: dns
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ops/validation-logs | Out-Null
          ./scripts/validate_dns_txt_records.ps1 *>&1 | Tee-Object -FilePath ops/validation-logs/gh-dns-records.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-forwarding-validation-logs
          path: ops/validation-logs/gh-*.log

      - name: Build run summary
        if: always()
        shell: pwsh
        run: |
          $front = "${{ steps.front.outcome }}"
          $dns = "${{ steps.dns.outcome }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Front Domain Smoke Results"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Forwarding check: **$front**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- DNS records check: **$dns**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Logs artifact: `dns-forwarding-validation-logs`"

      - name: Create or update DNS blocker issue
        if: ${{ steps.front.outcome == 'failure' || steps.dns.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Launch Blocker: DNS or Forwarding Validation Failed';
            const logs = [];
            const candidates = [
              'ops/validation-logs/gh-front-domain-smoke.log',
              'ops/validation-logs/gh-dns-records.log',
            ];

            for (const p of candidates) {
              if (fs.existsSync(p)) {
                const data = fs.readFileSync(p, 'utf8');
                logs.push(`### ${p}\n\n\`\`\`text\n${data.slice(-12000)}\n\`\`\``);
              }
            }

            const body = [
              'Automated DNS/forwarding validation failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              logs.join('\n\n'),
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops-blocker',
              per_page: 100,
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ops-blocker', 'dns', 'forwarding'],
              });
            }

      - name: Fail workflow on blockers
        if: ${{ steps.front.outcome == 'failure' || steps.dns.outcome == 'failure' }}
        shell: pwsh
        run: |
          Write-Error 'DNS and/or forwarding checks failed. See logs artifact and blocker issue.'
