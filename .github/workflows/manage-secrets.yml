name: Manage Brand Secrets

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - verify
          - rotate
          - setup-rotation
  schedule:
    # Rotate secrets quarterly
    - cron: '0 0 1 */3 *'

jobs:
  manage-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      
      - name: Install Dependencies
        working-directory: functions
        run: npm ci
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Get Secrets Status
        if: github.event.inputs.action == 'status' || github.event_name == 'schedule'
        working-directory: functions
        run: |
          node brand-secrets-init.js status
      
      - name: Verify Secrets Access
        if: github.event.inputs.action == 'verify'
        working-directory: functions
        run: |
          node brand-secrets-init.js verify
      
      - name: Setup Rotation Schedule
        if: github.event.inputs.action == 'setup-rotation'
        working-directory: functions
        run: |
          node brand-secrets-init.js setup-rotation
      
      - name: Notify Secrets Status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Brand Secrets Management - Action: ${{ github.event.inputs.action || "scheduled-check" }} - ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action
        continue-on-error: true
