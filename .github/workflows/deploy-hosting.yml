name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'download-site/**'
      - 'brand-export/**'
      - 'firebase.json'
      - '.github/workflows/deploy-hosting.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        brand: [prevleak, saferide, palettemath, qvedic]
      max-parallel: 2
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Deploy Hosting - ${{ matrix.brand }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          BRAND: ${{ matrix.brand }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:${{ matrix.brand }} --project saferide-peld8 --token $FIREBASE_TOKEN
      
      - name: Get Deployment URL
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase hosting:sites:list --project saferide-peld8 --token $FIREBASE_TOKEN
      
      - name: Notify Deployment Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '✅ Firebase Hosting deployed for **${{ matrix.brand }}** - Brand site live'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true
      
      - name: Notify Deployment Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Firebase Hosting deployment failed for ${{ matrix.brand }} - Check logs'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true
