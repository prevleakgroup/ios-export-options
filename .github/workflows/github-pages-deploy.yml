name: GitHub Pages Deployment

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DEPLOYMENT_DIR: download-site
  BUILD_OUTPUT: _site

jobs:
  validate-and-build:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate deployment tree
        shell: bash
        run: |
          if [ ! -d "${{ env.DEPLOYMENT_DIR }}" ]; then
            echo "Error: Deployment directory ${{ env.DEPLOYMENT_DIR }} not found"
            exit 1
          fi
          echo "✓ Deployment directory validated"

      - name: Validate Firebase setup requirements
        continue-on-error: true
        run: node scripts/validate_firebase_setup.js

      - name: Run unified publish guardrails
        continue-on-error: true
        shell: bash
        run: |
          if [ -f "scripts/publish_with_guardrails.ps1" ]; then
            echo "Note: PowerShell script detected, manual validation needed"
          fi

      - name: Build static site
        shell: bash
        run: |
          mkdir -p "${{ env.BUILD_OUTPUT }}"
          cp -r "${{ env.DEPLOYMENT_DIR }}"/* "${{ env.BUILD_OUTPUT }}/" || true
          echo "✓ Site built to ${{ env.BUILD_OUTPUT }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_OUTPUT }}

  deploy-to-pages:
    name: Deploy to GitHub Pages
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  configure-dns:
    name: DNS Configuration Guide
    needs: deploy-to-pages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate DNS configuration summary
        shell: bash
        run: |
          cat > dns-config-summary.md << 'EOF'
          # GitHub Pages DNS Configuration Summary
          
          ## Next Steps (Manual)
          
          ### 1. GitHub Repository Settings
          - Go to: Settings → Pages
          - Set source to: "Deploy from a branch"
          - Branch: `main` or `master`
          
          ### 2. Custom Domains (GoDaddy)
          For each domain, add these DNS records:
          
          **A Records (for root domain):**
          ```
          185.199.108.153
          185.199.109.153
          185.199.110.153
          185.199.111.153
          ```
          
          **CNAME Record (for www subdomain):**
          ```
          <username>.github.io
          ```
          
          ### 3. Add Domains in GitHub Pages
          - Settings → Pages → Custom domain
          - Add each domain one at a time
          - Verify DNS (GitHub will check)
          - Enable HTTPS (automatic)
          
          ### 4. Verify Status
          - GitHub Pages dashboard shows green checkmark when DNS verified
          - HTTPS certificate generation takes ~24 hours
          
          ## Domains to Configure
          - prevleak.company
          - palettemath.company
          - saferide.company
          - qvedic.company
          - plumber.company
          EOF
          cat dns-config-summary.md

      - name: Upload DNS guide
        uses: actions/upload-artifact@v4
        with:
          name: dns-configuration-guide
          path: dns-config-summary.md

      - name: Comment on workflow
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `
            ✅ **GitHub Pages Deployment Workflow Complete**
            
            Your site is now deployed to GitHub Pages. 
            
            **Next Steps:**
            1. Download \`dns-configuration-guide\` artifact from this run
            2. Add DNS records in GoDaddy for each domain
            3. Configure custom domains in repo Settings → Pages
            4. Wait for HTTPS certificate generation (~24 hours)
            
            **Check Status:** 
            - Repository Settings → Pages
            - Workflow run: ${runUrl}
            
            Once DNS verification is complete, your domains will show 🟢 green status.
            `;
            
            console.log(body);

