name: GitHub Pages Deployment

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DEPLOYMENT_DIR: download-site
  BUILD_OUTPUT: _site

jobs:
  validate-and-build:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate deployment tree
        shell: bash
        run: |
          if [ ! -d "${{ env.DEPLOYMENT_DIR }}" ]; then
            echo "Error: Deployment directory ${{ env.DEPLOYMENT_DIR }} not found"
            exit 1
          fi
          echo "✓ Deployment directory validated"

      - name: Validate Firebase setup requirements
        continue-on-error: true
        run: node scripts/validate_firebase_setup.js

      - name: Run unified publish guardrails
        continue-on-error: true
        shell: bash
        run: |
          if [ -f "scripts/publish_with_guardrails.ps1" ]; then
            echo "Note: PowerShell script detected, manual validation needed"
          fi

      - name: Build static site
        shell: bash
        run: |
          mkdir -p "${{ env.BUILD_OUTPUT }}"
          cp -r "${{ env.DEPLOYMENT_DIR }}"/* "${{ env.BUILD_OUTPUT }}/" || true
          echo "✓ Site built to ${{ env.BUILD_OUTPUT }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_OUTPUT }}

  deploy-to-pages:
    name: Deploy to GitHub Pages
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  configure-dns:
    name: DNS Configuration Guide
    needs: deploy-to-pages
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate DNS configuration summary
        shell: bash
        run: |
          cat > dns-config-summary.md << 'EOF'
          # GitHub Pages DNS Configuration Summary
          
          ## Next Steps (Manual)
          
          ### 1. GitHub Repository Settings
          - Go to: Settings → Pages
          - Set source to: "Deploy from a branch"
          - Branch: `main` or `master`
          
          ### 2. Custom Domains (GoDaddy)
          For each domain, add these DNS records:
          
          **A Records (for root domain):**
          ```
          185.199.108.153
          185.199.109.153
          185.199.110.153
          185.199.111.153
          ```
          
          **CNAME Record (for www subdomain):**
          ```
          <username>.github.io
          ```
          
          ### 3. Add Domains in GitHub Pages
          - Settings → Pages → Custom domain
          - Add each domain one at a time
          - Verify DNS (GitHub will check)
          - Enable HTTPS (automatic)
          
          ### 4. Verify Status
          - GitHub Pages dashboard shows green checkmark when DNS verified
          - HTTPS certificate generation takes ~24 hours
          
          ## Domains to Configure
          - prevleak.company
          - palettemath.company
          - saferide.company
          - qvedic.company
          - plumber.company
          EOF
          cat dns-config-summary.md

      - name: Upload DNS guide
        uses: actions/upload-artifact@v4
        with:
          name: dns-configuration-guide
          path: dns-config-summary.md

      - name: Comment on workflow
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `
            ✅ **GitHub Pages Deployment Workflow Complete**
            
            Your site is now deployed to GitHub Pages. 
            
            **Next Steps:**
            1. Download \`dns-configuration-guide\` artifact from this run
            2. Add DNS records in GoDaddy for each domain
            3. Configure custom domains in repo Settings → Pages
            4. Wait for HTTPS certificate generation (~24 hours)
            
            **Check Status:** 
            - Repository Settings → Pages
            - Workflow run: ${runUrl}
            
            Once DNS verification is complete, your domains will show 🟢 green status.
            `;
            
            console.log(body);

  setup-secrets-required:
    name: Secrets Configuration
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          echo "# GitHub Secrets Configuration"
          echo ""
          echo "## Required Secrets (Add in Settings → Secrets and variables → Actions)"
          echo ""
          echo "### 1. SSH_PRIVATE_KEY"
          echo "Purpose: Deploy SSH access for infrastructure operations"
          echo "How to add:"
          echo "  1. Generate SSH key: ssh-keygen -t ed25519"
          echo "  2. Copy private key content"
          echo "  3. Go to: Settings → Secrets and variables → Actions"
          echo "  4. Create secret: SSH_PRIVATE_KEY"
          echo ""
          echo "### 2. GCP_SERVICE_ACCOUNT_JSON"
          echo "Purpose: GCP authentication for Cloud operations"
          echo "How to add:"
          echo "  1. Create service account in GCP Console"
          echo "  2. Generate JSON key"
          echo "  3. Copy entire JSON content"
          echo "  4. Go to: Settings → Secrets and variables → Actions"
          echo "  5. Create secret: GCP_SERVICE_ACCOUNT_JSON"
          echo ""
          echo "### 3. FIREBASE_TOKEN (Already configured)"
          echo "Status: Required for Firebase deployment"
          echo ""
          echo "## Verification"
          echo "Secrets are passed securely to workflows via:"
          echo "  - \${{ secrets.SSH_PRIVATE_KEY }}"
          echo "  - \${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}"
          echo "  - \${{ secrets.FIREBASE_TOKEN }}"
          echo ""
          echo "⚠️  Never log or echo secret values"

      - name: Build summary
        shell: bash
        run: |
          cat > /tmp/setup-summary.txt << 'EOF'
          GitHub Pages Deployment Workflow Setup Complete
          
          ✅ Workflow created: github-pages-deploy.yml
          ✅ Deployment structure: download-site/ → _site/
          ✅ DNS configuration guide generated
          
          REQUIRED ACTIONS:
          
          1. Add GitHub Secrets (Settings → Secrets and variables → Actions):
             - SSH_PRIVATE_KEY: Your SSH private key
             - GCP_SERVICE_ACCOUNT_JSON: Your GCP service account JSON
             - FIREBASE_TOKEN: Already configured (if using Firebase)
          
          2. Configure DNS Records (in GoDaddy):
             - Add A records for root domain
             - Add CNAME for www subdomain
          
          3. Enable in GitHub (Settings → Pages):
             - Custom domain
             - Enforce HTTPS
          
          4. Verify Status:
             - Green checkmark appears when DNS verified
             - Check repository Settings → Pages
          EOF
          cat /tmp/setup-summary.txt
