name: Multi-Domain Brand Deployment

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  FIREBASE_PROJECT: saferide-peld8
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

jobs:
  validate-and-build:
    name: Validate All Brands
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate brand directories
        shell: bash
        run: |
          echo "Checking brand directory structure..."
          
          brands=("prevleak-site" "saferide-site" "palettemath-site" "qvedic-site")
          
          for brand in "${brands[@]}"; do
            dir="download-site/$brand"
            if [ -f "$dir/index.html" ] && [ -f "$dir/styles.css" ]; then
              echo "✓ $brand: Valid structure"
            else
              echo "✗ $brand: Missing required files"
              exit 1
            fi
          done
          
          echo "All brands validated ✓"

      - name: Validate Firebase configuration
        shell: bash
        run: |
          echo "Checking firebase.json..."
          
          targets=$(grep '"target"' firebase.json | wc -l)
          echo "Found $targets hosting targets"
          
          if [ "$targets" -eq 4 ]; then
            echo "✓ All 4 brand targets configured"
          else
            echo "✗ Expected 4 targets, found $targets"
            exit 1
          fi

  deploy-prevleak:
    name: Deploy PrevLeak to prevleak.company
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy PrevLeak
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only hosting:prevleak \
            --project saferide-peld8 \
            --debug

      - name: Verify deployment
        run: |
          echo "✓ PrevLeak deployed to https://prevleak-peld8.web.app"
          echo "Domain: prevleak.company (requires DNS configuration)"

  deploy-saferide:
    name: Deploy Saferide to saferide.company
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Saferide
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only hosting:saferide \
            --project saferide-peld8 \
            --debug

      - name: Verify deployment
        run: |
          echo "✓ Saferide deployed to https://saferide-peld8.web.app"
          echo "Domain: saferide.company (requires DNS configuration)"

  deploy-palettemath:
    name: Deploy Palettemath to palettemath.company
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Palettemath
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only hosting:palettemath \
            --project saferide-peld8 \
            --debug

      - name: Verify deployment
        run: |
          echo "✓ Palettemath deployed to https://palettemath-peld8.web.app"
          echo "Domain: palettemath.company (requires DNS configuration)"

  deploy-qvedic:
    name: Deploy Qvedic to qvedic.company
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Qvedic
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only hosting:qvedic \
            --project saferide-peld8 \
            --debug

      - name: Verify deployment
        run: |
          echo "✓ Qvedic deployed to https://qvedic-peld8.web.app"
          echo "Domain: qvedic.company (requires DNS configuration)"

  finalize:
    name: Deployment Summary
    needs: [deploy-prevleak, deploy-saferide, deploy-palettemath, deploy-qvedic]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          cat << 'EOF'
          
          ╔════════════════════════════════════════════════════════════════╗
          ║               Multi-Domain Deployment Complete                 ║
          ╚════════════════════════════════════════════════════════════════╝
          
          Deployed Brands:
          ✓ PrevLeak    → https://prevleak-peld8.web.app
            Domain: prevleak.company
          
          ✓ Saferide    → https://saferide-peld8.web.app
            Domain: saferide.company
          
          ✓ Palettemath → https://palettemath-peld8.web.app
            Domain: palettemath.company
          
          ✓ Qvedic      → https://qvedic-peld8.web.app
            Domain: qvedic.company
          
          NEXT STEPS:
          1. Add each domain to Firebase Console under Hosting → Custom domains
          2. Configure DNS records in GoDaddy for each domain
          3. Wait for DNS verification (5-30 minutes)
          4. HTTPS certificates will auto-generate after DNS verification
          
          Learn more: https://firebase.google.com/docs/hosting/custom-domain
          
          EOF
